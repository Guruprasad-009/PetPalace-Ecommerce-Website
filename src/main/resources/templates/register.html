<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>User Registration | PetPalace</title>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Bootstrap Icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

	<!-- Google Font -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
		rel="stylesheet">

	<style>
		body {
			background: #f4f6f9;
			font-family: 'Poppins', sans-serif;
		}

		.card {
			border: none;
			border-radius: 15px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
		}

		.card-header {
			background: #212529;
			color: #ffc107;
			border-radius: 15px 15px 0 0 !important;
		}

		.form-control {
			border-radius: 8px;
		}

		.form-control:focus {
			box-shadow: none;
			border-color: #0d6efd;
		}

		textarea {
			resize: none;
		}

		.btn {
			border-radius: 8px;
			font-weight: 600;
		}

		a {
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}
	</style>

</head>

<body>

	<div class="container py-5">

		<div class="row justify-content-center">

			<div class="col-lg-7 col-md-9 col-sm-11">

				<div class="card">

					<!-- Card Header -->

					<div class="card-header text-center py-3">

						<h2 class="mb-0">

							<i class="bi bi-person-plus-fill"></i>

							User Registration

						</h2>

					</div>

					<!-- Card Body -->

					<div class="card-body p-4">

						<form th:action="@{/user/save}" method="post" th:object="${user}">

							<!-- Full Name -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									<i class="bi bi-person-fill"></i>
									Full Name
								</label>

								<input type="text" class="form-control" th:field="*{fullname}"
									placeholder="Enter Full Name" required>

							</div>

							<!-- Email -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									<i class="bi bi-envelope-fill"></i>
									Email Address
								</label>

								<input type="email" class="form-control" th:field="*{email}"
									placeholder="Enter Email Address" required>

							</div>

							<!-- Password -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									<i class="bi bi-lock-fill"></i>
									Password
								</label>

								<div class="input-group">

									<input type="password" class="form-control" id="password" th:field="*{password}"
										placeholder="Enter Password" required>

									<button class="btn btn-outline-secondary px-5 me-2" type="button" onclick="togglePassword()">

										<i class="bi bi-eye" id="eyeIcon"></i>

									</button>

								</div>

							</div>

							<!-- Mobile -->

							<div class="mb-4">

								<label class="form-label fw-semibold">
									<i class="bi bi-telephone-fill"></i>
									Mobile Number
								</label>

								<input type="text" class="form-control" th:field="*{mobile}"
									placeholder="Enter Mobile Number" required>

							</div>

							<!-- Buttons -->

							<div class="text-center">

								<button type="submit" class="btn btn-warning px-5 me-2">

									<i class="bi bi-person-check-fill"></i>

									Register

								</button>

								<button type="reset" class="btn btn-secondary px-5">

									<i class="bi bi-arrow-counterclockwise"></i>

									Reset

								</button>

							</div>

						</form>

						<hr>

						<div class="text-center">

							<span class="text-muted">
								Already have an account?
							</span>

							<a th:href="@{/login}" class="fw-bold">

								Login Here

							</a>

						</div>

					</div>

				</div>

			</div>

		</div>

	</div>

	<!-- Bootstrap JS -->

	<script>

		function togglePassword() {

			const password = document.getElementById("password");
			const eyeIcon = document.getElementById("eyeIcon");

			if (password.type === "password") {

				password.type = "text";
				eyeIcon.classList.remove("bi-eye");
				eyeIcon.classList.add("bi-eye-slash");

			} else {

				password.type = "password";
				eyeIcon.classList.remove("bi-eye-slash");
				eyeIcon.classList.add("bi-eye");

			}

		}

	</script>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
