<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Product | PetPalace</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: 'Poppins', sans-serif;
        }

        /* Navbar */

        .navbar {
            background: #212529 !important;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
        }

        .navbar-brand {
            color: #ffc107 !important;
            font-size: 30px;
            font-weight: 700;
        }

        /* Card */

        .card {
            border: none;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
        }

        .card-header {
            background: #212529;
            color: #ffc107;
        }

        /* Form */

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 .2rem rgba(255, 193, 7, .25);
        }

        textarea {
            resize: none;
        }

        .form-label {
            font-weight: 600;
        }

        /* Buttons */

        .btn {
            border-radius: 10px;
            font-weight: 600;
            transition: .3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        /* Footer */

        footer {
            background: #212529;
            color: white;
            margin-top: 60px;
        }

        footer h5 {
            color: #ffc107;
        }
    </style>

</head>

<body>

    <!-- ===================== NAVBAR ===================== -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand" th:href="@{/admin-dashboard}">
                <i class="bi bi-shop"></i>
                PetPalace
            </a>

            <div class="d-flex align-items-center">

                <!-- Welcome -->
					<span class="text-white fw-semibold me-5">
						<i class="bi bi-person-circle text-warning"></i>
						Welcome,
						<b th:text="${session.loggedInUser.fullname}"></b>
					</span>

                <a th:href="@{/admin-dashboard}" class="btn btn-danger">

                    <i class="bi bi-box-arrow-right"></i>

                    Home

                </a>

            </div>

        </div>

    </nav>

    <!-- ===================== FORM ===================== -->

    <div class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card">

                    <div class="card-header text-center py-4">

                        <h2>

                            <i class="bi bi-plus-circle-fill"></i>

                            Add New Product

                        </h2>

                        <p class="mb-0 text-light">

                            Fill all product details carefully.

                        </p>

                    </div>

                    <div class="card-body p-4">

                        <form th:action="@{/save}"
                              th:object="${product}"
                              method="post"
                              enctype="multipart/form-data">

                            <input type="hidden" th:field="*{id}">

                            <!-- Product Name -->

                            <div class="mb-3">

                                <label class="form-label">

                                    <i class="bi bi-box-seam text-warning"></i>

                                    Product Name

                                </label>

                                <input type="text"
                                       class="form-control"
                                       th:field="*{name}"
                                       placeholder="Enter Product Name"
                                       required>

                            </div>

                            <!-- Price & Quantity -->

                            <div class="row">

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-currency-rupee text-success"></i>

                                        Price

                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{price}"
                                           placeholder="Enter Product Price"
                                           required>

                                </div>

                                <div class="col-md-6 mb-3">

                                    <label class="form-label">

                                        <i class="bi bi-boxes text-primary"></i>

                                        Quantity

                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{quantity}"
                                           placeholder="Enter Quantity"
                                           required>

                                </div>

                            </div>

                            <!-- Description -->

                            <div class="mb-3">

                                <label class="form-label">

                                    <i class="bi bi-card-text text-info"></i>

                                    Description

                                </label>

                                <textarea rows="5"
                                          class="form-control"
                                          th:field="*{description}"
                                          placeholder="Enter Product Description"
                                          required></textarea>

                            </div>

                            <!-- Image -->

                            <div class="mb-4">

                                <label class="form-label">

                                    <i class="bi bi-image-fill text-danger"></i>

                                    Product Image

                                </label>

                                <input type="file"
                                       name="imageFile"
                                       class="form-control"
                                       accept=".jpg,.jpeg,.png,.webp"
                                       required>

                            </div>
                            
                            <!-- Buttons -->

                            <div class="text-center">

                                <button type="submit" class="btn btn-warning me-3 ">

                                    <i class="bi bi-cloud-upload-fill"></i>

                                    Add Product

                                </button>

                                <button type="reset "
                                        class="btn btn-secondary me-3">

                                    <i class="bi bi-arrow-counterclockwise"></i>

                                    Reset

                                </button>

                                <a th:href="@{/admin-dashboard}"
                                   class="btn btn-dark ">

                                    <i class="bi bi-house-door-fill"></i>

                                    Back To Dashboard

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ===================== FOOTER ===================== -->

    <footer class="py-4">

        <div class="container text-center">

            <h5>

                <i class="bi bi-shop"></i>

                PetPalace Admin Panel

            </h5>

            <p class="mb-0">

                © 2026 PetPalace. All Rights Reserved.

            </p>

        </div>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
