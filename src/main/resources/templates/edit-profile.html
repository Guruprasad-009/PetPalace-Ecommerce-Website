<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | PetPalace</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        body {
            background: #f4f6f9;
            font-family: 'Poppins', sans-serif;
        }

        /* Navbar */

        .navbar {
            background: #212529;
            padding: 15px 0;
        }

        .navbar-brand {
            color: #ffc107 !important;
            font-size: 28px;
            font-weight: 700;
        }

        .welcome-text {
            color: white;
            font-weight: 500;
        }

        .welcome-text i {
            color: #ffc107;
        }

        /* Main Card */

        .profile-container {
            max-width: 900px;
            margin: 50px auto;
        }

        .edit-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
        }

        .edit-header {
            background: #212529;
            color: #ffc107;
            text-align: center;
            padding: 30px;
        }

        .edit-header i {
            font-size: 55px;
        }

        .edit-header h2 {
            font-weight: 700;
            margin-top: 10px;
        }

        .edit-header p {
            color: white;
            margin-bottom: 0;
        }

        .card-body {
            padding: 35px;
        }

        /* Form */

        .form-label {
            font-weight: 600;
        }

        .input-group-text {
            background: #212529;
            color: #ffc107;
            border: 1px solid #212529;
        }

        .form-control {
            padding: 12px;
            border-radius: 0 8px 8px 0;
        }

        .form-control:focus {
            border-color: #ffc107;
            box-shadow: 0 0 0 .2rem rgba(255, 193, 7, .15);
        }

        /* Buttons */

        .btn {
            border-radius: 10px;
            font-weight: 600;
            padding: 11px 25px;
        }

        /* Password Section */

        .password-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
        }

        .password-section h5 {
            font-weight: 700;
        }

        /* Footer */

        footer {
            background: #212529;
            color: white;
            margin-top: 60px;
            padding: 25px 0;
        }

        footer h5 {
            color: #ffc107;
            font-weight: 700;
        }

        @media (max-width: 768px) {

            .welcome-text {
                display: none;
            }

            .profile-container {
                margin: 25px auto;
            }

            .card-body {
                padding: 20px;
            }

        }

    </style>

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark shadow">

    <div class="container">

        <a class="navbar-brand" th:href="@{/user-dashboard}">

            <i class="bi bi-shop"></i>

            PetPalace

        </a>


        <div class="d-flex align-items-center gap-3">

            <span class="welcome-text">

                <i class="bi bi-person-circle"></i>

                Welcome,

                <b th:text="${session.loggedInUser.fullname}"></b>

            </span>


            <a th:href="@{/my-cart}"
               class="btn btn-warning">

                <i class="bi bi-cart-fill"></i>

            </a>


            <a th:href="@{/logout}"
               class="btn btn-danger">

                <i class="bi bi-box-arrow-right"></i>

                Logout

            </a>

        </div>

    </div>

</nav>



<!-- ================= EDIT PROFILE ================= -->

<div class="container profile-container">

    <div class="card edit-card">


        <!-- HEADER -->

        <div class="edit-header">

            <i class="bi bi-person-fill-gear"></i>

            <h2>Edit Profile</h2>

            <p>
                Update your PetPalace account information
            </p>

        </div>


        <!-- BODY -->

        <div class="card-body">

            <form th:action="@{/update-profile}"
                  th:object="${user}"
                  method="post">


                <!-- Hidden ID -->

                <input type="hidden"
                       th:field="*{id}">


                <div class="row g-4">


                    <!-- FULL NAME -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Full Name

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-person-fill"></i>

                            </span>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{fullname}"
                                   placeholder="Enter your full name"
                                   required>

                        </div>

                    </div>



                    <!-- EMAIL -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Email Address

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-envelope-fill"></i>

                            </span>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   placeholder="Enter your email"
                                   required>

                        </div>

                    </div>



                    <!-- MOBILE -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Mobile Number

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-phone-fill"></i>

                            </span>

                            <input type="tel"
                                   class="form-control"
                                   th:field="*{mobile}"
                                   placeholder="Enter mobile number"
                                   required>

                        </div>

                    </div>



                    <!-- ADDRESS -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Address

                        </label>

                        <div class="input-group">

                            <span class="input-group-text">

                                <i class="bi bi-house-fill"></i>

                            </span>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{address}"
                                   placeholder="Enter your address">

                        </div>

                    </div>


                </div>



                <!-- ================= PASSWORD ================= -->

                <div class="password-section">

                    <h5 class="mb-3">

                        <i class="bi bi-shield-lock-fill text-warning"></i>

                        Change Password

                    </h5>

                    <p class="text-muted">

                        Leave the password fields empty if you don't want
                        to change your password.

                    </p>


                    <div class="row g-4">


                        <!-- NEW PASSWORD -->

                        <div class="col-md-6">

                            <label class="form-label">

                                New Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock-fill"></i>

                                </span>

                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       name="password"
                                       placeholder="Enter new password">

                            </div>

                        </div>



                        <!-- CONFIRM PASSWORD -->

                        <div class="col-md-6">

                            <label class="form-label">

                                Confirm Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="bi bi-lock-fill"></i>

                                </span>

                                <input type="password"
                                       class="form-control"
                                       id="confirmPassword"
                                       placeholder="Confirm new password">

                            </div>

                        </div>


                    </div>


                    <div class="form-check mt-3">

                        <input class="form-check-input"
                               type="checkbox"
                               id="showPassword">

                        <label class="form-check-label"
                               for="showPassword">

                            Show Password

                        </label>

                    </div>

                </div>



                <!-- ================= BUTTONS ================= -->

                <div class="text-center mt-4">

                    <button type="submit"
                            class="btn btn-warning me-2">

                        <i class="bi bi-check-circle-fill"></i>

                        Save Changes

                    </button>


                    <a th:href="@{/profile}"
                       class="btn btn-secondary">

                        <i class="bi bi-x-circle-fill"></i>

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </div>

</div>



<!-- ================= FOOTER ================= -->

<footer>

    <div class="container text-center">

        <h5>

            <i class="bi bi-shop"></i>

            PetPalace

        </h5>

        <p class="mb-0">

            © 2026 PetPalace. All Rights Reserved.

        </p>

    </div>

</footer>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<!-- Password Show/Hide -->

<script>

    document.getElementById("showPassword").addEventListener("change", function () {

        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");

        if (this.checked) {

            password.type = "text";
            confirmPassword.type = "text";

        } else {

            password.type = "password";
            confirmPassword.type = "password";

        }

    });


    document.querySelector("form").addEventListener("submit", function (event) {

        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== "" && password !== confirmPassword) {

            alert("Passwords do not match.");

            event.preventDefault();

        }

    });

</script>


</body>

</html>
