<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Edit Product | PetPalace</title>

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Bootstrap Icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

	<!-- Google Font -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
		rel="stylesheet">

	<style>
		body {
			background: #f4f6f9;
			font-family: 'Poppins', sans-serif;
		}

		.card {
			border: none;
			border-radius: 15px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
		}

		.card-header {
			background: #ffc107;
			color: #212529;
			border-radius: 15px 15px 0 0 !important;
		}

		.form-control {
			border-radius: 8px;
		}

		.form-control:focus {
			box-shadow: none;
			border-color: #ffc107;
		}

		textarea {
			resize: none;
		}

		.btn {
			border-radius: 8px;
			font-weight: 600;
		}
	</style>

</head>

<body>

	<div class="container py-5">

		<div class="row justify-content-center">

			<div class="col-lg-7 col-md-9 col-sm-11">

				<!-- Card Starts -->

				<div class="card">

					<!-- Card Header -->

					<div class="card-header text-center py-3">

						<h2 class="mb-0">
							<i class="bi bi-pencil-square"></i>
							Edit Product
						</h2>

					</div>

					<!-- Card Body -->

					<div class="card-body p-4">

						<form th:action="@{/update-product}" method="post" th:object="${product}"
							enctype="multipart/form-data">

							<!-- Hidden Product ID -->

							<input type="hidden" th:field="*{id}">

							<input type="hidden" th:field="*{image}">

							<!-- Product Name -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									<i class="bi bi-box-seam"></i>
									Product Name
								</label>

								<input type="text" class="form-control" th:field="*{name}"
									placeholder="Enter Product Name" required>

							</div>

							<!-- Price -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									<i class="bi bi-currency-rupee"></i>
									Price
								</label>

								<input type="number" class="form-control" th:field="*{price}"
									placeholder="Enter Product Price" required>

							</div>

							<!-- Quantity -->

							<div class="mb-3">

								<label class="form-label fw-semibold">
									<i class="bi bi-boxes"></i>
									Quantity
								</label>

								<input type="number" class="form-control" th:field="*{quantity}"
									placeholder="Enter Quantity" required>

							</div>

							<!-- Description -->

							<div class="mb-4">

								<label class="form-label fw-semibold">
									<i class="bi bi-card-text"></i>
									Description
								</label>

								<textarea class="form-control" rows="5" th:field="*{description}"
									placeholder="Enter Product Description" required></textarea>

							</div>

							<!-- images -->

							<div class="mb-4 text-center">
								<label class="form-label fw-semibold">
									Current Product Image
								</label>
								<br>
								<img th:src="@{'/images/' + ${product.image}}" alt="Current Image" class="img-thumbnail"
									width="180" height="180" style="object-fit: cover;">
							</div>

							<!-- Upload New Image -->
							<div class="mb-4">
								<label class="form-label fw-semibold">Upload New Image</label>
								<input type="file" name="imageFile" class="form-control" accept=".jpg,.jpeg,.png,.webp">

								<div class="form-text">
									Leave this field empty if you don't want to change the current product image.
								</div>
							</div>


							<!-- Update Button -->

							<div class="text-center">

								<button type="submit" class="btn btn-warning px-5">

									<i class="bi bi-arrow-repeat"></i>
									Update Product

								</button>

								<button type="reset" class="btn btn-secondary px-4">

									<i class="bi bi-arrow-counterclockwise"></i>

									Reset

								</button>

								<a th:href="@{/view-products}" class="btn btn-danger px-4">

									<i class="bi bi-x-circle"></i>

									Cancel

								</a>

							</div>

						</form>

					</div>

				</div>

				<!-- Card Ends -->

			</div>

		</div>

	</div>

	<!-- Bootstrap Bundle JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
