<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users | PetPalace Admin</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
        }
        
        /* Navbar */

        .navbar {
            background: #212529 !important;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
        }

        .navbar-brand {
            color: #ffc107 !important;
            font-size: 30px;
            font-weight: 700;
        }

        .page-title{
            font-weight:700;
            color:#343a40;
        }

        .user-card{
            border:none;
            border-radius:18px;
            overflow:hidden;
            box-shadow:0 8px 25px rgba(0,0,0,.08);
        }

        .card-header{
            background:linear-gradient(135deg,#ffb703,#fb8500);
            color:white;
        }

        .table thead{
            background:#212529;
            color:white;
        }

        .table tbody tr:hover{
            background:#fff8e7;
            transition:.3s;
        }

        .avatar{
            width:42px;
            height:42px;
            border-radius:50%;
            background:#ffc107;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            font-size:22px;
        }

        .badge-role{
            font-size:13px;
            padding:8px 12px;
        }

        .search-box{
            max-width:350px;
        }

        .counter-box{
            background:white;
            border-radius:15px;
            padding:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.08);
        }

        .table td{
            vertical-align:middle;
        }
        
        /* Footer */

        footer {
            background: #212529;
            color: white;
            margin-top: 60px;
        }

        footer h5 {
            color: #ffc107;
        }
        
    </style>

</head>

<body>

<!-- ===================== NAVBAR ===================== -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand" th:href="@{/admin-dashboard}">
                <i class="bi bi-shop"></i>
                PetPalace
            </a>

            <div class="d-flex align-items-center">

                <!-- Welcome -->
					<span class="text-white fw-semibold me-5">
						<i class="bi bi-person-circle text-warning"></i>
						Welcome,
						<b th:text="${session.loggedInUser.fullname}"></b>
					</span>

                <a th:href="@{/admin-dashboard}" class="btn btn-danger">

                    <i class="bi bi-box-arrow-right"></i>

                    Home

                </a>

            </div>

        </div>

    </nav>


<div class="container py-5">

    <!-- Heading -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2 class="page-title">
                <i class="bi bi-people-fill text-warning"></i>
                Registered Users
            </h2>

            <p class="text-muted mb-0">
                Manage all registered customers of PetPalace.
            </p>
        </div>
    </div>

    <!-- Top Section -->

    <div class="row mb-4">

        <div class="col-md-4">

            <div class="counter-box">

                <h6>Total Registered Users</h6>

                <h2 class="text-warning"
                    th:text="${#lists.size(users)}">
                    0
                </h2>

            </div>

        </div>

        <div class="col-md-8 d-flex justify-content-end align-items-center">

            <div class="input-group ">

					<input type="text" id="searchInput" class="form-control" placeholder="Search by Name or Email...">

					<button class="btn btn-warning me-3" type="submit">
						<i class="bi bi-search"></i>
					</button>

				</div>

        </div>

    </div>

    <!-- Users Table -->

    <div class="card user-card">

        <div class="card-header">

            <h4 class="mb-0">
                <i class="bi bi-person-lines-fill"></i>
                Users List
            </h4>

        </div>

        <div class="card-body p-0">

            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0" id="userTable">

                    <thead>

                    <tr>

                        <th>ID</th>

                        <th>User</th>

                        <th>Email</th>

                        <th>Mobile</th>

                        <th>Role</th>

                        <th>Status</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="user : ${users}">

                        <td th:text="${user.id}"></td>

                        <td>

                            <div class="d-flex align-items-center">

                                <div class="avatar me-3">

                                    <i class="bi bi-person-fill"></i>

                                </div>

                                <div>

                                    <strong th:text="${user.fullname}"></strong>

                                </div>

                            </div>

                        </td>

                        <td th:text="${user.email}"></td>

                        <td th:text="${user.mobile}"></td>

                        <td>

                            <span class="badge bg-primary badge-role"
                                  th:text="${user.role}">
                            </span>

                        </td>

                        <td>

                            <span class="badge bg-success">
                                Active
                            </span>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<!-- ===================== FOOTER ===================== -->

    <footer class="py-4">

        <div class="container text-center">

            <h5>

                <i class="bi bi-shop"></i>

                PetPalace Admin Panel

            </h5>

            <p class="mb-0">

                © 2026 PetPalace. All Rights Reserved.

            </p>

        </div>

    </footer>


<script>

    const searchInput = document.getElementById("searchInput");

    searchInput.addEventListener("keyup", function () {

        let filter = this.value.toLowerCase();

        let rows = document.querySelectorAll("#userTable tbody tr");

        rows.forEach(row => {

            let text = row.innerText.toLowerCase();

            row.style.display = text.includes(filter) ? "" : "none";

        });

    });

</script>

</body>

</html>
