<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>All Products | PetPalace</title>

	<!-- Bootstrap 5 CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

	<!-- Bootstrap Icons -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

	<!-- Google Font -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
		rel="stylesheet">

	<style>
		body {
			background: #f4f6f9;
			font-family: 'Poppins', sans-serif;
		}
		
		.navbar {
    background-color: #212529 !important;
    box-shadow: 0 5px 15px rgba(0, 0, 0, .15);
}

.navbar-brand {
    color: #ffc107 !important;
    font-size: 30px;
    font-weight: 700;
}

		.page-title {
			color: #212529;
			font-weight: 700;
		}

		.card {
			border: none;
			border-radius: 15px;
			box-shadow: 0 10px 25px rgba(0, 0, 0, .12);
		}

		.card-header {
			background: #212529;
			color: #ffc107;
			border-radius: 15px 15px 0 0 !important;
		}

		.table thead {
			background: #343a40;
			color: #fff;
		}

		.table tbody tr {
			transition: all .3s ease;
		}

		.table tbody tr:hover {
			background: #fff8e1;
		}

		.btn {
			border-radius: 8px;
			font-weight: 500;
		}

		.table td,
		.table th {
			vertical-align: middle;
		}
	</style>

</head>

<body>

<!-- ===================== NAVBAR ===================== -->

	<nav class="navbar navbar-expand-lg navbar-dark shadow">

		<div class="container">

			<!-- Brand -->
			<a class="navbar-brand" th:href="@{/user-dashboard}">
				<i class="bi bi-shop"></i> PetPalace
			</a>

			<!-- Toggle Button -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

				<span class="navbar-toggler-icon"></span>

			</button>

			<div class="collapse navbar-collapse" id="navbarNav">

				<!-- Push everything to the right -->
				<div class="ms-auto d-flex align-items-center">

					<!-- Welcome -->
					<span class="text-white fw-semibold me-5">
						<i class="bi bi-person-circle text-warning"></i>
						Welcome,
						<b th:text="${session.loggedInUser.fullname}"></b>
					</span>

					<form th:action="@{/search-cart}" method="get">

						<div class="input-group ">

							<input class="form-control" type="search" name="keyword" placeholder="Search Products">

							<button class="btn btn-warning me-3" type="submit" >
								<i class="bi bi-search"></i>
							</button>

						</div>

					</form>

					<!-- Wishlist -->
					<a th:href="@{/wishlist}" class="btn btn-outline-light me-3">
						<i class="bi bi-heart-fill"></i>
					</a>

					<!-- Cart -->
					<a th:href="@{/my-cart}" class="btn btn-warning me-3">
						<i class="bi bi-cart-fill"></i>
					</a>

					<!-- Logout -->
					<a th:href="@{/logout}" class="btn btn-danger">
						<i class="bi bi-box-arrow-right"></i>
						Logout
					</a>

				</div>

			</div>

		</div>

	</nav>



	<div class="container py-5">

		<!-- Page Heading -->
		
		
		<div class="text-center mb-4">

			<h2 class="page-title">
				<i class="bi bi-box-seam-fill text-warning"></i>
				All Products
			</h2>

			<p class="text-muted">
				View all available products in the PetPalace inventory.
			</p>

		</div>
		
		
		<!-- Card -->

		<div class="card">

			<div class="card-header py-3">

				<h4 class="mb-0">
					Product List
				</h4>

			</div>
			
			

			<div class="card-body">

				<div class="table-responsive">

					<table class="table table-bordered table-hover align-middle text-center">

						<thead>

							<tr>
								<th>ID</th>
								<th>Image</th>
								<th>Product Name</th>
								<th>Price (₹)</th>
								<th>Quantity</th>
								<th>Description</th>
								<th>Action</th>
							</tr>

						</thead>

						<tbody>

							<tr th:each="product : ${products}">

								<td th:text="${product.id}"></td>

								<td>
									<img th:src="@{'/images/' + ${product.image}}"
									 alt="Product Image" 
									 width="80"
									 height="80" 
									 class="rounded border" 
									 style="object-fit: cover;">
								</td>

								<td th:text="${product.name}"></td>

								<td th:text="${product.price}"></td>

								<td th:text="${product.quantity}"></td>

								<td th:text="${product.description}"></td>

								<td>

									<div class="d-flex justify-content-center gap-2">

										<a th:href="@{/edit-product/{id}(id=${product.id})}"
											class="btn btn-warning btn-sm">
											<i class="bi bi-pencil-square"></i> Edit
										</a>

										<a th:href="@{/delete-product/{id}(id=${product.id})}"
											onclick=" confirm('Are you sure you want to delete this product?');"
											class="btn btn-danger btn-sm">
											<i class="bi bi-trash"></i> Delete

										</a>

									</div>


								</td>

							</tr>

						</tbody>

					</table>

				</div>

			</div>

		</div>

	</div>

	<!-- Bootstrap JS Bundle -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	
	<script
	

</body>
